buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.6.0'
group = 'xy177.farmersfuturedelight'
archivesBaseName = 'farmers-future-delight'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

sourceSets.main.output.resourcesDir = sourceSets.main.output.classesDir

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    

    runs {
        client {
            workingDirectory project.file('run')

            property 'fml.coreMods.load', 'xy177.farmersfuturedelight.core.FFDLoadingPlugin'

            mods {
                farmers_future_delight {
                    source sourceSets.main
                }
            }

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run')

            property 'fml.coreMods.load', 'xy177.farmersfuturedelight.core.FFDLoadingPlugin'

            mods {
                farmers_future_delight {
                    source sourceSets.main
                }
            }

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://www.cursemaven.com/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    implementation fg.deobf("curse.maven:the-one-probe-community-edition-885670:9174145")
    compileOnly fg.deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.716')
    compileOnly fg.deobf('CraftTweaker2:CraftTweaker2-API:4.1.20.716')
    compileOnly fg.deobf('CraftTweaker2:ZenScript:4.1.20.716')
    compileOnly fg.deobf('mezz.jei:jei_1.12.2:4.16.1.1013')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}

jar {
    exclude 'assets/farmers_future_delight/textures/gui/panorama/**'
    exclude 'assets/farmers_future_delight/textures/gui/title/background/panorama_?.png'
    manifest {
        attributes([
            "Specification-Title": "farmers_future_delight",
            "Specification-Vendor": "xy177",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"xy177",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "FMLCorePlugin": "xy177.farmersfuturedelight.core.FFDLoadingPlugin",
            "FMLCorePluginContainsFMLMod": "true",
            "TweakClass": "xy177.farmersfuturedelight.bootstrap.FFDEarlyTweaker",
            "TweakOrder": "-10000",
            "ForceLoadAsMod": "true"
        ])
    }
}

jar.finalizedBy('reobfJar') 

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
